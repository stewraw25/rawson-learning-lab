<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" role="img" aria-label="Rawson Labs">
  <defs>
    <linearGradient id="rlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#314f39"/>
      <stop offset="100%" stop-color="#1a2e1f"/>
    </linearGradient>
    <linearGradient id="rlGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#e8c547"/>
    </linearGradient>
    <linearGradient id="rlPageL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <linearGradient id="rlPageR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e6c8"/>
      <stop offset="100%" stop-color="#dcc896"/>
    </linearGradient>
  </defs>

  <!-- Green capsule -->
  <rect width="168" height="44" rx="14" fill="url(#rlBg)"/>
  <rect x="0.6" y="0.6" width="166.8" height="42.8" rx="13.4" fill="none" stroke="#f3e6c8" stroke-opacity="0.22" stroke-width="1"/>

  <!--
    Content block ~ icon 28 + gap 10 + text ~78 ≈ 116 wide
    Centre in 168: start x = (168 - 116) / 2 ≈ 26
    Vertical centre for 28px icon: (44 - 28) / 2 = 8
  -->
  <g transform="translate(26 8)">
    <!-- Icon tile -->
    <rect width="28" height="28" rx="8" fill="#243528"/>
    <rect x="0.5" y="0.5" width="27" height="27" rx="7.5" fill="none" stroke="#f3e6c8" stroke-opacity="0.2"/>
    <!-- open book -->
    <path d="M6 9.5c3.9-.65 6.5-2.9 8.5-4.1v13.8c-2.6 1.5-5.4 2.7-8.5 2.7V9.5z" fill="url(#rlPageL)"/>
    <path d="M22.5 9.5c-3.9-.65-6.5-2.9-8.5-4.1v13.8c2.6 1.5 5.4 2.7 8.5 2.7V9.5z" fill="url(#rlPageR)"/>
    <path d="M13.8 5.8h1.1v14.2c-.45.3-.65.3-1.1 0V5.8z" fill="#6d4c41"/>
    <path d="M21.4 11.4c2.2.5 3.4 2 3.55 4-2-.35-3.2-1.85-3.55-4z" fill="#81c784"/>

    <!-- Wordmark — vertically centred next to icon -->
    <text
      x="38"
      y="12"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="13.5"
      font-weight="700"
      fill="#f7f1e3"
      dominant-baseline="middle">Rawson</text>
    <text
      x="38"
      y="22.5"
      font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="8.5"
      font-weight="800"
      fill="url(#rlGold)"
      letter-spacing="0.22em"
      dominant-baseline="middle">LABS</text>
  </g>
</svg>
