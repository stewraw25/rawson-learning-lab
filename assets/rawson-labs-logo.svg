<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" role="img" aria-label="Rawson Labs">
  <defs>
    <linearGradient id="rlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#314f39"/>
      <stop offset="100%" stop-color="#1a2e1f"/>
    </linearGradient>
    <linearGradient id="rlGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#e8c547"/>
    </linearGradient>
    <linearGradient id="rlPageL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <linearGradient id="rlPageR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e6c8"/>
      <stop offset="100%" stop-color="#dcc896"/>
    </linearGradient>
  </defs>

  <!-- Clean capsule -->
  <rect width="188" height="40" rx="12" fill="url(#rlBg)"/>
  <rect x="0.6" y="0.6" width="186.8" height="38.8" rx="11.4" fill="none" stroke="#f3e6c8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Mark: rounded tile + open book + leaf -->
  <g transform="translate(6 5)">
    <rect width="30" height="30" rx="9" fill="#243528"/>
    <rect x="0.5" y="0.5" width="29" height="29" rx="8.5" fill="none" stroke="#f3e6c8" stroke-opacity="0.18"/>
    <!-- open book -->
    <path d="M6.5 10.2c4.2-.7 7-3.1 9.2-4.4v14.8c-2.8 1.6-5.8 2.9-9.2 2.9V10.2z" fill="url(#rlPageL)"/>
    <path d="M24.5 10.2c-4.2-.7-7-3.1-9.2-4.4v14.8c2.8 1.6 5.8 2.9 9.2 2.9V10.2z" fill="url(#rlPageR)"/>
    <path d="M15 6.2h1.2v15.2c-.5.35-.7.35-1.2 0V6.2z" fill="#6d4c41"/>
    <!-- tiny leaf -->
    <path d="M23.2 12.2c2.4.55 3.7 2.2 3.85 4.3-2.2-.4-3.5-2-3.85-4.3z" fill="#81c784"/>
  </g>

  <!-- Wordmark -->
  <text
    x="44"
    y="17.5"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="700"
    fill="#f7f1e3"
    letter-spacing="0.01em">Rawson</text>
  <text
    x="44"
    y="30"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="9"
    font-weight="800"
    fill="url(#rlGold)"
    letter-spacing="0.28em">LABS</text>
</svg>
