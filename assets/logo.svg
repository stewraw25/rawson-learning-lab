<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Rawson Learning Lab">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3d30"/>
      <stop offset="50%" stop-color="#243528"/>
      <stop offset="100%" stop-color="#1e3324"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e6c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8d6e63" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e6c8"/>
      <stop offset="100%" stop-color="#dcc896"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2e1f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dark garden tile matching site chrome -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)" filter="url(#glow)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- Soft sun glow -->
  <circle cx="94" cy="30" r="14" fill="#ffd54f" opacity="0.2"/>
  <circle cx="94" cy="30" r="9" fill="#ffd54f"/>
  <circle cx="91" cy="27" r="2.5" fill="#fff8e1" opacity="0.7"/>

  <!-- Garden base -->
  <path d="M14 98c12-10 28-14 50-14s38 4 50 14v12H14V98z" fill="url(#grass)"/>
  <path d="M14 104c14-6 30-9 50-9s36 3 50 9v6H14v-6z" fill="#1b5e20" opacity="0.45"/>

  <!-- Leaves -->
  <ellipse cx="22" cy="72" rx="10" ry="5" fill="#81c784" transform="rotate(-40 22 72)" opacity="0.9"/>
  <ellipse cx="106" cy="74" rx="10" ry="5" fill="#66bb6a" transform="rotate(38 106 74)" opacity="0.9"/>
  <ellipse cx="28" cy="84" rx="7" ry="3.5" fill="#a5d6a7" transform="rotate(-20 28 84)"/>
  <ellipse cx="100" cy="86" rx="7" ry="3.5" fill="#81c784" transform="rotate(25 100 86)"/>

  <!-- Small flowers -->
  <g transform="translate(20 92)">
    <circle r="3.2" fill="#e891a8"/>
    <circle cx="-3" cy="1.5" r="2.6" fill="#f8bbd0"/>
    <circle cx="3" cy="1.5" r="2.6" fill="#f8bbd0"/>
    <circle r="1.5" fill="#ffecb3"/>
  </g>
  <g transform="translate(108 93)">
    <circle r="3" fill="#e8c547"/>
    <circle cx="-2.8" cy="1.2" r="2.4" fill="#ffe082"/>
    <circle cx="2.8" cy="1.2" r="2.4" fill="#ffe082"/>
    <circle r="1.3" fill="#fff8e1"/>
  </g>

  <!-- Vintage open book -->
  <path d="M28 40c17-2 27-11 36-15v54c-11 6-23 11-36 11V40z" fill="url(#pageL)" stroke="#a1887f" stroke-width="1.4"/>
  <path d="M100 40c-17-2-27-11-36-15v54c11 6 23 11 36 11V40z" fill="url(#pageR)" stroke="#a1887f" stroke-width="1.4"/>
  <!-- leather spine -->
  <path d="M62 27h4v56c-2 1.5-2 1.5-4 0V27z" fill="url(#leather)"/>
  <path d="M61 28h6v4H61z" fill="#6d4c41"/>
  <!-- ruled lines -->
  <path d="M36 50h18M36 58h16M36 66h18M36 74h13" stroke="#a1887f" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M74 50h18M74 58h16M74 66h18M74 74h13" stroke="#a1887f" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- red bookmark -->
  <path d="M64 76l-3.5 12 3.5-2.5 3.5 2.5z" fill="#c62828"/>
  <!-- tiny gold corner flourish -->
  <circle cx="42" cy="44" r="1.5" fill="#e8c547" opacity="0.8"/>
  <circle cx="86" cy="44" r="1.5" fill="#e8c547" opacity="0.7"/>
</svg>
