  <rect width="108" height="36" rx="10" fill="#0a0a0a"/>
  <rect x="1" y="1" width="106" height="34" rx="9" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Simple star / spark (not a clock) -->
  <path d="M16 10l1.6 4.4H22l-3.6 2.8 1.4 4.4L16 19.2l-3.8 2.4 1.4-4.4L10 14.4h4.4z" fill="#fff"/>
